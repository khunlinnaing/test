name: Simple HTML Check + Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tidy
        run: sudo apt-get update && sudo apt-get install -y tidy

      - name: Check HTML
        run: tidy -qe index.html

      - name: Test HTML content
        run: grep -q "Hello" index.html

      - name: Build (HTML no build needed)
        run: echo "Build step skipped for HTML"

      - name: Deploy to AWS EC2
        uses: appleboy/scp-action@v0.1.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "./*"
          target: "/var/www/html/"

      - name: Check homepage after deploy
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://${{ secrets.EC2_HOST }})
          if [ "$STATUS" -eq 200 ]; then
            echo "✔ Homepage is OK"
          else
            echo "❌ Homepage check failed!"
            exit 1
          fi

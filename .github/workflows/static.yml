name: HTML Check (Only HTML)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tidy (HTML checker)
        run: sudo apt-get update && sudo apt-get install -y tidy

      - name: Validate all HTML files
        run: |
          echo "Checking HTML files..."
          # find all .html files and validate them
          for file in $(find . -name "*.html"); do
            echo "Checking $file"
            tidy -qe "$file" || exit 1
          done

name: Simple HTML Check + Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  html-deploy:
    runs-on: self-hosted  # AWS EC2 self-hosted runner

    steps:
      # 1️⃣ Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Install tidy for HTML validation
      - name: Install tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      # 3️⃣ Validate HTML syntax
      - name: Validate HTML
        run: tidy -qe index.html

      # 4️⃣ Test HTML content
      - name: Test HTML content
        run: |
          if grep -q "Hello" index.html; then
            echo "✔ HTML content test passed"
          else
            echo "❌ HTML content test failed!"
            exit 1
          fi

      # 5️⃣ Build step (skipped for HTML)
      - name: Build step
        run: echo "Build skipped for HTML"

      # 6️⃣ Debug: Check EC2 secrets (for runner logs)
      - name: Debug EC2 secrets
        run: |
          echo "EC2 Host: ${{ secrets.EC2_HOST }}"
          echo "EC2 User: ${{ secrets.EC2_USER }}"
          echo "🔒 Private key is hidden"

      # 7️⃣ Deploy to AWS EC2 via SCP
      - name: Deploy to AWS EC2
        uses: appleboy/scp-action@v0.1.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}          # private key content from secrets
          source: "./*"                        # all repo files
          target: "/var/www/html/"             # server path
          debug: true                           # verbose SSH logs

      # 8️⃣ Verify homepage after deploy
      - name: Check homepage
        run: |
          # Use HTTPS if SSL enabled, otherwise HTTP
          URL="http://${{ secrets.EC2_HOST }}"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" $URL)
          if [ "$STATUS" -eq 200 ]; then
            echo "✔ Homepage is reachable"
          else
            echo "❌ Homepage check failed! Status code: $STATUS"
            exit 1
          fi
